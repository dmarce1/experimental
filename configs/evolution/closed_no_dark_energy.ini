# Closed matter cosmology: Omega_cold=2, Omega_DE=0 (including radiation).
# Omega_k is chosen to cancel matter and radiation at a=1 exactly.
# Evolve through turnaround to a=1e-6 on the contracting branch.
# Predicted crunch is 82859247244.676422 yr from present; cutoff ~0.75 yr earlier.
# 32^3 particles in a 100 Mpc/h box; run from the repository root.

[cosmology]
hubble = 67.4
omegaBaryonH2 = 0.0224
omegaCdmH2 = 0.88615200000000016
omegaNeutrinoH2 = 0
omegaCurvature = -1.0000920960544775
massiveNeutrinos = 0
masslessNeutrinos = 3
effectiveNeutrinos = 3.046
scalarAmplitude = 2.1e-9
spectralIndex = 0.965
spectralRunning = 0
pivotMpcInverse = 0.05
darkEnergyW = -1
darkEnergyWa = 0
temperatureCmb = 2.7255
heliumFraction = 0.245
opticalDepth = 0.054

[initialConditions]
meshExponent = 5
boxLength = 100
seed = 42
maximumDensityDeviation = 0.1
component = cdmAndBaryons

[timestep]
eta = 0.025

[gravity.softening]
cellFraction = 0.05
kernelOrder = 2

[simulation]
evolve = true
stopTime = end
minimumScaleFactor = 1e-6

[output]
checkpointPrefix = output/closed_no_dark_energy
# Includes initial and final states; 98 interior outputs at equal conformal spacing.
snapshotCount = 100
acceleration = false
potential = false
