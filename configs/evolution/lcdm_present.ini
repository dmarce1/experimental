# Standard flat Lambda CDM; stop at the expanding a=1 present.
# 32^3 particles in a 100 Mpc/h box; run from the repository root.

[cosmology]
hubble = 67.4
omegaBaryonH2 = 0.0224
omegaCdmH2 = 0.12
omegaNeutrinoH2 = 0.00064
omegaCurvature = 0
massiveNeutrinos = 1
masslessNeutrinos = 2
effectiveNeutrinos = 3.046
scalarAmplitude = 2.1e-9
spectralIndex = 0.965
spectralRunning = 0
pivotMpcInverse = 0.05
darkEnergyW = -1
darkEnergyWa = 0
temperatureCmb = 2.7255
heliumFraction = 0.245
opticalDepth = 0.054

[initialConditions]
meshExponent = 5
boxLength = 100
seed = 42
maximumDensityDeviation = 0.1
component = cdmAndBaryons

[timestep]
eta = 0.025

[gravity.softening]
cellFraction = 0.05
kernelOrder = 2

[simulation]
evolve = true
stopTime = 0
minimumScaleFactor = 1e-6

[output]
checkpointPrefix = output/lcdm_present
# Includes initial and final states; 98 interior outputs at equal conformal spacing.
snapshotCount = 100
acceleration = false
potential = false
