# Standard flat Lambda CDM; final cosmic age = 10 times the present age.
# For the parameters below, t0 = 13792880934.981705 yr.
# stopTime is measured FROM present, so it is 9*t0 = 124135928414.83534 yr.
# 32^3 particles in a 100 Mpc/h box; run from the repository root.

[execution]
cuda.drift=on
cuda.multipole=on
cuda.kick=on

[cosmology]
hubble = 67.4
omegaBaryonH2 = 0.0224
omegaCdmH2 = 0.12
omegaNeutrinoH2 = 0.00064
omegaCurvature = 0
massiveNeutrinos = 1
masslessNeutrinos = 2
effectiveNeutrinos = 3.046
scalarAmplitude = 2.1e-9
spectralIndex = 0.965
spectralRunning = 0
pivotMpcInverse = 0.05
darkEnergyW = -1
darkEnergyWa = 0
temperatureCmb = 2.7255
heliumFraction = 0.245
opticalDepth = 0.054

[initialConditions]
meshExponent = 5
boxLength = 100
seed = 42
maximumDensityDeviation = 0.1
component = cdmAndBaryons

[timestep]
eta = 0.025

[gravity.softening]
cellFraction = 0.05
kernelOrder = 2

[simulation]
evolve = true
stopTime = 124135928414.83534
minimumScaleFactor = 1e-6

[output]
checkpointPrefix = output/lcdm_ten_ages
# Includes initial and final states; 98 interior outputs at equal conformal spacing.
snapshotCount = 100
acceleration = false
potential = false
