# CosmicTiger application defaults. Run from the repository root with:
#   ./release/cosmictiger --configurationFile=default.ini
# configurationFile is intentionally omitted.
# help is handled on the command line; its INI value is ignored.
help = false # Show CosmicTiger options and exit

[simulation]
initialScaleFactor = 0.01 # Nominal initial scale factor; generated initial conditions select their own epoch
stopTime = 0 # Physical years from the present (a=1), or end for a recollapsing cosmology
minimumScaleFactor = 1e-6 # Positive scale factor at which an end run stops before the Big Crunch singularity
evolve = true # Advance initialized or restarted particles

[cosmology]
hubble = 67.4 # Hubble constant in km/s/Mpc
omegaBaryonH2 = 0.0224 # Physical baryon density, Omega_b h^2
omegaCdmH2 = 0.12 # Physical cold dark matter density, Omega_c h^2
omegaNeutrinoH2 = 0.00064 # Physical massive neutrino density, Omega_nu h^2
omegaCurvature = 0 # Curvature density fraction
massiveNeutrinos = 1 # Number of massive neutrino species
masslessNeutrinos = 2 # Number of massless neutrino species
effectiveNeutrinos = 3.046 # Total effective neutrino count
scalarAmplitude = 2.1e-9 # Primordial scalar amplitude
spectralIndex = 0.965 # Primordial scalar spectral index
spectralRunning = 0 # Primordial scalar spectral running
pivotMpcInverse = 0.05 # Scalar pivot in inverse Mpc
darkEnergyW = -1 # Dark energy equation-of-state w
darkEnergyWa = 0 # Dark energy equation-of-state wa
temperatureCmb = 2.7255 # CMB temperature in kelvin
heliumFraction = 0.245 # Primordial helium fraction
opticalDepth = 0.054 # Reionization optical depth

[initialConditions]
generate = false # Generate initial particle conditions and write Silo output
outputPrefix = # Silo output path prefix, required when generation is enabled
meshExponent = 5 # Initial-condition FFT and particle lattice side is 2^meshExponent; particle count is 2^(NDIM*meshExponent)
boxLength = 100 # Comoving box length in Mpc/h
seed = 42 # Independent Gaussian realization seed for Zel'dovich initial conditions
maximumDensityDeviation = 0.1 # Linear density threshold for initial epoch
earliestScaleFactor = 0.001 # Earliest scale factor to search
latestScaleFactor = 1 # Latest scale factor to search
maximumLogScaleFactorStep = 0.1 # Maximum search step in ln(a)
logScaleFactorTolerance = 1e-4 # Bracket tolerance in ln(a)
growthDerivativeStep = 0.001 # Growth derivative step in ln(a)
maximumSpectrumEvaluations = 256 # Maximum spectrum evaluations
samplesPerLogInterval = 50 # CAMB samples per natural log wave-number interval
accuracyBoost = 1 # CAMB accuracy boost
component = cdmAndBaryons # Matter component: totalMatter, cdmAndBaryons, or cdm

[timestep]
eta = 0.025 # Acceleration-softening timestep accuracy parameter

[gravity]
fmmOrder = 6 # Local expansion rank p and multipole rank p-1; supported orders are 2 through 9
meshExponent = 5 # Evolution FFT and Cartesian cell side is 2^meshExponent; defaults to initialConditions.meshExponent
ghostWidth = 1 # Ghost-cell layers and direct-neighbor radius: one or two
softening.model = ferrers # Gravity softening model: ferrers or plummer
nearField = direct # Near-cell gravity: direct P2P, or tree for a local FMM walk over per-cell kd-trees (Ferrers softening, CPU kick only)
openingAngle = 0.55 # Tree near-field opening angle theta, greater than zero and less than one
softening.cellFraction = 0.05 # Ferrers support radius q or Plummer epsilon as a fraction of the cell width, greater than zero and at most one
softening.kernelOrder = 2 # Ferrers softening kernel order, from zero through three
direct.sinkFraction = 0 # Fraction of particles sampled for a direct periodic gravity comparison, from zero (disabled) to one
direct.seed = 42 # Independent random seed for direct-gravity sink selection

[execution]
cuda.drift = on # Use CUDA for particle drift: on or off
cuda.kick = on # Use CUDA for particle gravity kick: on or off
cuda.multipole = on # Use CUDA for particle-to-multipole cell construction: on or off
cuda.direct = on # Use CUDA for the direct periodic gravity reference solve: on or off

[restart]
manifest = # Continue a completed evolution checkpoint manifest
rungZeroExtension = 0 # Enlarge saved rung-zero interval by 2^n and add n to all particle rungs

[output]
checkpointPrefix = simulation # Evolution checkpoint and diagnostics path prefix
snapshotCount = 1 # Silo snapshots evenly spaced in conformal time; counts above one include the initial and final states
acceleration = false # Retain particle accelerations for Silo output
potential = false # Retain particle potentials for Silo output

[lightcone]
enabled = false # Record past-lightcone particle crossings and sparse NESTED HEALPix maps
nside = 64 # HEALPix side resolution, a power of two up to 2^29
maximumRadius = 1 # Maximum comoving radius in box lengths
observerX = 0 # Observer x coordinate in [0,1)
observerY = 0 # Observer y coordinate in [0,1)
observerZ = 0 # Observer z coordinate in [0,1)
observationTime = 0 # Observer epoch in physical years from expanding a=1
outputPrefix = lightcone # Per-run, per-locality lightcone CSV path prefix
